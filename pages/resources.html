<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resources • CampusLearn™</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="../assets/css/resources.css" rel="stylesheet" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">CampusLearn™</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="resources.html">Resources</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="resources-container animate-fade-in">
    <h2 class="page-title">Learning Resources</h2>
    
    <!-- Upload Section -->
    <div class="upload-section">
      <h4 class="mb-4"><i class="fas fa-cloud-upload-alt me-2"></i>Upload Resource</h4>
      <form id="uploadForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Module Code</label>
          <input type="text" id="moduleCode" class="form-control" placeholder="e.g., DB101" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">File Type</label>
          <select id="fileType" class="form-select" required>
            <option value="">Select Type</option>
            <option value="pdf">PDF Document</option>
            <option value="doc">Word Document</option>
            <option value="image">Image (JPEG, PNG)</option>
            <option value="video">Video</option>
            <option value="interactive">Interactive Content</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Visibility</label>
          <select id="visibility" class="form-select" required>
            <option value="private">Private (Only You)</option>
            <option value="public">Public (Shareable)</option>
          </select>
        </div>
        <div class="col-12">
          <div class="file-drop-zone" id="dropZone">
            <i class="fas fa-file-upload fa-2x mb-2"></i>
            <p class="mb-0">Drag and drop your file here or</p>
            <input type="file" id="fileInput" class="form-control d-none" required />
            <button type="button" class="btn btn-outline-primary mt-2" onclick="document.getElementById('fileInput').click()">
              Browse Files
            </button>
          </div>
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-upload">
            <i class="fa fa-upload me-2"></i>Upload Resource
          </button>
          <p id="uploadStatus" class="upload-status mt-2"></p>
        </div>
      </form>
    </div>

    <!-- Resources Grid -->
    <div class="resources-grid" id="resourcesGrid">
      <!-- Resources will be dynamically added here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/resources.js"></script>
</body>
</html>
